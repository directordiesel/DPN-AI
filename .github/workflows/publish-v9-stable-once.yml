name: Publish DPN AI v9 Stable Once

on:
  push:
    branches:
      - ops/publish-v9.0.0
    paths:
      - .github/workflows/publish-v9-stable-once.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.ref == 'refs/heads/ops/publish-v9.0.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/publish-v9.0.0
          persist-credentials: true

      - name: Verify stable main target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)"
          test "$main_sha" = "7854842645d891f5656191f95029a3d6ac6b1481"
          version="$(gh api repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=main --jq .content | base64 -d | tr -d '\r\n ')"
          test "$version" = "9.0.0"
          if gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v9.0.0 >/dev/null 2>&1; then
            echo "::error::Tag v9.0.0 already exists"
            exit 1
          fi

      - name: Dispatch stable release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref main -f version=v9.0.0 -f prerelease=false

      - name: Remove one-time dispatcher from ops branch
        shell: bash
        run: |
          git config user.name "DPN Release Automation"
          git config user.email "112266230+directordiesel@users.noreply.github.com"
          git rm .github/workflows/publish-v9-stable-once.yml
          git commit -m "ops(release): remove one-time v9 publication dispatcher"
          git push origin HEAD:ops/publish-v9.0.0
