name: DPN AI v8 Coordinated Version Promotion

on:
  push:
    branches:
      - feature/dpn-ai-desktop-v8
    paths:
      - ".github/workflows/v8-version-promotion.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/dpn-ai-desktop-v8
          fetch-depth: 0

      - name: Promote v8.0.0 metadata atomically
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          Set-Content -Path .\VERSION -Value "8.0.0" -Encoding ascii -NoNewline

          $mainPath = ".\app\main.py"
          $main = Get-Content $mainPath -Raw
          $oldMain = 'APP_VERSION = "6.0.0"'
          $newMain = 'APP_VERSION = "8.0.0"'
          $mainMatches = [regex]::Matches($main, [regex]::Escape($oldMain)).Count
          if ($mainMatches -ne 1) { throw "Expected exactly one APP_VERSION 6.0.0 assignment; found $mainMatches" }
          $main = $main.Replace($oldMain, $newMain)
          Set-Content -Path $mainPath -Value $main -Encoding utf8 -NoNewline

          $indexPath = ".\app\static\index.html"
          $index = Get-Content $indexPath -Raw
          foreach ($pair in @(
            @('styles.css?v=6.0.0','styles.css?v=8.0.0'),
            @('app.js?v=6.0.0','app.js?v=8.0.0'),
            @('STABLE CORE v6.0.0','STABLE CORE v8.0.0'),
            @('STABLE INTELLIGENCE v7 • v8 WINDOWS DESKTOP DEVELOPMENT','STABLE CORE v8.0.0 • WINDOWS DESKTOP PLATFORM')
          )) {
            if ($index.Contains($pair[0])) { $index = $index.Replace($pair[0], $pair[1]) }
          }
          Set-Content -Path $indexPath -Value $index -Encoding utf8 -NoNewline

      - name: Verify coordinated version promotion
        shell: powershell
        run: |
          python -m pytest -q tests\test_v7_version_consistency.py
          python tools\v8_release_gate.py --report

      - name: Commit promoted metadata
        shell: powershell
        run: |
          git config user.name "DPN v8 Release Automation"
          git config user.email "112266230+directordiesel@users.noreply.github.com"
          git add VERSION app/main.py app/static/index.html
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m "release(v8): promote coordinated runtime metadata to 8.0.0"
            git push origin HEAD:feature/dpn-ai-desktop-v8
          }
