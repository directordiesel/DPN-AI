name: Android Mobile Validation

on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'tests/test_mobile_*.py'
      - '.github/workflows/android-mobile-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Run Android lint
        working-directory: mobile/android
        run: gradle --no-daemon :app:lintDebug

      - name: Verify release build stays unsigned without explicit secrets
        shell: bash
        run: |
          if grep -R --line-number -E '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|storePassword\s*=\s*"|keyPassword\s*=\s*")' mobile/android; then
            echo 'Potential signing secret material found in source control.'
            exit 1
          fi

  mobile-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run mobile regression guards
        run: python -m unittest discover -s tests -p 'test_mobile_*.py'
