name: Android Mobile Validation

on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'tests/test_mobile_*.py'
      - '.github/workflows/android-mobile-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

# DPN-AI mobile validation runs entirely on GitHub-hosted runners.
concurrency:
  group: android-mobile-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-validation:
    name: android-debug-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Run Android lint
        working-directory: mobile/android
        shell: bash
        run: |
          if ! gradle --no-daemon :app:lintDebug; then
            REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$REPORT" ]; then
              echo '--- Android lint report ---'
              cat "$REPORT"
            fi
            exit 1
          fi
      - name: Verify release build stays unsigned without explicit secrets
        shell: bash
        run: |
          if grep -R --line-number -E '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|storePassword\s*=\s*"|keyPassword\s*=\s*")' mobile/android; then
            echo 'Potential signing secret material found in source control.'
            exit 1
          fi

  mobile-contract-tests:
    name: mobile-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run mobile regression guards
        run: python -m pytest -q tests/test_mobile_*.py
