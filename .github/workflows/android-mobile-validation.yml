name: Android Mobile Validation

on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'tests/test_mobile_*.py'
      - '.github/workflows/android-mobile-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

# DPN-AI mobile validation runs entirely on GitHub-hosted runners.
concurrency:
  group: android-mobile-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-validation:
    name: android-debug-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Run Android lint
        working-directory: mobile/android
        shell: bash
        run: |
          if ! gradle --no-daemon :app:lintDebug; then
            REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$REPORT" ]; then
              echo '--- Android lint report ---'
              cat "$REPORT"
            fi
            exit 1
          fi
      - name: Verify release build stays unsigned without explicit secrets
        shell: bash
        run: |
          if grep -R --line-number -E '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|storePassword\s*=\s*"|keyPassword\s*=\s*")' mobile/android; then
            echo 'Potential signing secret material found in source control.'
            exit 1
          fi

  mobile-contract-tests:
    name: mobile-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run mobile regression guards
        run: python -m pytest -q tests/test_mobile_*.py
