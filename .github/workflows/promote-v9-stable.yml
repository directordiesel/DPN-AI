name: Promote DPN AI v9 Stable

on:
  push:
    branches:
      - release/dpn-ai-v9.0.0
    paths:
      - .github/workflows/promote-v9-stable.yml

permissions:
  contents: write

jobs:
  promote:
    if: github.ref == 'refs/heads/release/dpn-ai-v9.0.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/dpn-ai-v9.0.0
          fetch-depth: 0
          persist-credentials: true

      - name: Promote exact RC identifiers to stable
        shell: python
        run: |
          from pathlib import Path

          exact_files = [
              Path('VERSION'),
              Path('README.md'),
              Path('app/main.py'),
              Path('app/static/index.html'),
              Path('app/static/app.js'),
              Path('app/static/sw.js'),
          ]

          old = '9.0.0-rc.1'
          new = '9.0.0'
          total = 0
          for path in exact_files:
              text = path.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count:
                  text = text.replace(old, new)
                  total += count
                  path.write_text(text, encoding='utf-8')

          if Path('VERSION').read_text(encoding='utf-8').strip() != new:
              raise SystemExit('VERSION did not promote to 9.0.0')
          if total < 6:
              raise SystemExit(f'Expected at least 6 RC identifiers, replaced {total}')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '<img alt="Release Candidate" src="https://img.shields.io/badge/9.0.0-Release%20Candidate-7c3aed?style=for-the-badge">',
              '<img alt="Stable" src="https://img.shields.io/badge/Stable-v9.0.0-7c3aed?style=for-the-badge">',
          )
          text = text.replace('> **Release candidate:** 9.0.0 · DPN AI v9  ', '> **Published stable release:** v9.0.0 · DPN AI v9  ')
          readme.write_text(text, encoding='utf-8')

          index = Path('app/static/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('<title>DPN AI v9 RC — Control Center</title>', '<title>DPN AI v9 — Control Center</title>')
          index.write_text(text, encoding='utf-8')

          Path('.github/workflows/promote-v9-stable.yml').unlink()

      - name: Commit stable promotion
        shell: bash
        run: |
          git config user.name "DPN Release Automation"
          git config user.email "112266230+directordiesel@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): promote DPN AI v9.0.0 stable"
          git push origin HEAD:release/dpn-ai-v9.0.0
