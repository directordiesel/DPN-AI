name: Repository Health

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"
      - "SECURITY.md"
      - "SUPPLY_CHAIN.md"
      - "RELEASE_PROCESS.md"
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-health-main:
    if: github.event_name != 'pull_request'
    name: Repository Health
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve trusted Windows Python
        shell: cmd
        run: .github\scripts\resolve_windows_python.cmd
      - name: Verify configured Python
        shell: cmd
        run: |
          where python
          python --version
      - name: Verify repository standards
        shell: python
        run: |
          from pathlib import Path
          required = ["README.md", "SECURITY.md", "CONTRIBUTING.md", "SUPPORT.md", "PROPRIETARY_NOTICE.md", "RELEASE_PROCESS.md", "ROADMAP.md", "CHANGELOG.md", "SUPPLY_CHAIN.md", ".github/CODEOWNERS", ".github/scripts/generate_supply_chain.py", ".github/workflows/release.yml", ".github/workflows/supply-chain.yml", ".github/workflows/security-gate.yml", ".github/workflows/runtime-assurance.yml", ".github/workflows/ci.yml", ".github/dependabot.yml", ".github/PULL_REQUEST_TEMPLATE.md", ".github/ISSUE_TEMPLATE/bug_report.yml", ".github/ISSUE_TEMPLATE/feature_request.yml", ".github/ISSUE_TEMPLATE/security_or_infrastructure.yml", ".github/ISSUE_TEMPLATE/config.yml"]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit("Missing required standards: " + ", ".join(missing))
          print(f"Validated {len(required)} required repository standards")
      - name: Enforce immutable GitHub Action references and checkout credential isolation
        shell: python
        run: |
          from pathlib import Path
          import re
          workflows = sorted(Path(".github/workflows").glob("*.y*ml"))
          uses_re = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)")
          sha_re = re.compile(r"^[0-9a-fA-F]{40}$")
          failures = []
          for workflow in workflows:
              lines = workflow.read_text(encoding="utf-8").splitlines()
              for index, line in enumerate(lines):
                  match = uses_re.match(line)
                  if not match:
                      continue
                  reference = match.group(1)
                  if reference.startswith("./") or reference.startswith("docker://"):
                      continue
                  if "@" not in reference:
                      failures.append(f"{workflow}:{index + 1}: action reference has no immutable ref: {reference}")
                      continue
                  action, ref = reference.rsplit("@", 1)
                  if not sha_re.fullmatch(ref):
                      failures.append(f"{workflow}:{index + 1}: action is not pinned to a 40-character commit SHA: {reference}")
                  if action == "actions/checkout":
                      window = "\n".join(lines[index + 1:index + 8])
                      if not re.search(r"^\s+persist-credentials:\s*false\s*(?:#.*)?$", window, re.MULTILINE):
                          failures.append(f"{workflow}:{index + 1}: actions/checkout must set persist-credentials: false")
          if failures:
              raise SystemExit("GitHub Actions policy violations:\n- " + "\n- ".join(failures))
          print(f"Validated immutable action references across {len(workflows)} workflows")
      - name: Enforce controlled release ref
        shell: python
        run: |
          from pathlib import Path
          release = Path(".github/workflows/release.yml").read_text(encoding="utf-8")
          failures = []
          trigger_block = release.split("permissions:", 1)[0]
          if "\n  push:" in trigger_block:
              failures.append("release workflow must not publish from push-triggered mutable branches")
          if "workflow_dispatch:" not in trigger_block:
              failures.append("release workflow must retain manual workflow_dispatch")
          if "if: github.ref == 'refs/heads/main'" not in release:
              failures.append("release job must be restricted to refs/heads/main")
          if failures:
              raise SystemExit("Release control policy violations: " + "; ".join(failures))
          print("Validated main-only manual release policy")
      - name: Reject tracked runtime secrets and private state
        shell: python
        run: |
          import re, subprocess
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          pattern = re.compile(r"(^|/)\.env$|(^|/)(vault|master)[^/]*\.key$|(^|/)FIRST_RUN_LOGIN\.txt$|(^|/)data/.*\.(sqlite|sqlite3|db|enc)$|(^|/)workspace/generated/|(^|/)workspace/uploads/|(^|/)runtime_logs/|(^|/)install_logs/", re.I)
          sensitive = [p for p in tracked if pattern.search(p)]
          if sensitive:
              raise SystemExit("Sensitive/runtime files are tracked: " + ", ".join(sensitive))
          print("No tracked runtime secrets or private state detected")
      - name: Detect unresolved merge conflicts and oversized files
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          conflicts = []
          oversized = []
          for name in tracked:
              path = Path(name)
              if not path.is_file():
                  continue
              if path.stat().st_size > 99614720:
                  oversized.append(f"{name} ({path.stat().st_size} bytes)")
              if path.suffix.lower() != ".md":
                  try:
                      text = path.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  if any(line.startswith("<<<<<<< ") or line.startswith(">>>>>>> ") for line in text.splitlines()):
                      conflicts.append(name)
          if conflicts:
              raise SystemExit("Possible unresolved merge conflicts: " + ", ".join(conflicts))
          if oversized:
              raise SystemExit("Tracked files exceed 95 MB: " + ", ".join(oversized))
          print("No unresolved merge conflicts or oversized tracked files detected")

  repository-health-pr-trusted:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'directordiesel'
    name: Repository Health
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve trusted Windows Python
        shell: cmd
        run: .github\scripts\resolve_windows_python.cmd
      - name: Verify configured Python
        shell: cmd
        run: |
          where python
          python --version
      - name: Run portable repository and version guard
        shell: cmd
        run: python .github\scripts\ci_repository_guard.py
      - name: Enforce immutable action references
        shell: python
        run: |
          from pathlib import Path
          import re
          workflows = sorted(Path(".github/workflows").glob("*.y*ml"))
          uses_re = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)")
          sha_re = re.compile(r"^[0-9a-fA-F]{40}$")
          failures = []
          for workflow in workflows:
              lines = workflow.read_text(encoding="utf-8").splitlines()
              for index, line in enumerate(lines):
                  match = uses_re.match(line)
                  if not match:
                      continue
                  reference = match.group(1)
                  if reference.startswith("./") or reference.startswith("docker://"):
                      continue
                  if "@" not in reference or not sha_re.fullmatch(reference.rsplit("@", 1)[-1]):
                      failures.append(f"{workflow}:{index + 1}: non-immutable action reference: {reference}")
          if failures:
              raise SystemExit("GitHub Actions policy violations:\n- " + "\n- ".join(failures))

  repository-health-pr-hosted:
    if: github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'directordiesel')
    name: Repository Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run portable repository and version guard
        run: python .github/scripts/ci_repository_guard.py
      - name: Enforce immutable action references
        shell: python
        run: |
          from pathlib import Path
          import re
          workflows = sorted(Path(".github/workflows").glob("*.y*ml"))
          uses_re = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)")
          sha_re = re.compile(r"^[0-9a-fA-F]{40}$")
          failures = []
          for workflow in workflows:
              lines = workflow.read_text(encoding="utf-8").splitlines()
              for index, line in enumerate(lines):
                  match = uses_re.match(line)
                  if not match:
                      continue
                  reference = match.group(1)
                  if reference.startswith("./") or reference.startswith("docker://"):
                      continue
                  if "@" not in reference or not sha_re.fullmatch(reference.rsplit("@", 1)[-1]):
                      failures.append(f"{workflow}:{index + 1}: non-immutable action reference: {reference}")
          if failures:
              raise SystemExit("GitHub Actions policy violations:\n- " + "\n- ".join(failures))
