name: Repository Health

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"
      - "SECURITY.md"
      - "SUPPLY_CHAIN.md"
      - "RELEASE_PROCESS.md"
      - "requirements*.txt"
      - "requirements*.lock"
      - "packaging/windows/**"
      - "desktop/updater.py"
      - "desktop/update_client.py"
      - "app/network_security.py"
      - "app/connectors.py"
      - "app/browser_adapter.py"
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-health-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-health:
    name: Repository Health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run portable repository and version guard
        run: python .github/scripts/ci_repository_guard.py
      - name: Verify repository standards
        shell: python
        run: |
          from pathlib import Path
          required = ["README.md", "SECURITY.md", "CONTRIBUTING.md", "SUPPORT.md", "PROPRIETARY_NOTICE.md", "RELEASE_PROCESS.md", "ROADMAP.md", "CHANGELOG.md", "SUPPLY_CHAIN.md", ".github/CODEOWNERS", ".github/scripts/generate_supply_chain.py", ".github/scripts/sign_update_manifest.py", ".github/scripts/verify_windows_release_bundle.py", ".github/scripts/write_update_trust_root.py", ".github/scripts/verify_release_lock.py", ".github/scripts/generate_release_wheel_hash_lock.py", "requirements-release.lock", "requirements-release-win312.lock", "packaging/windows/build-release-assets.ps1", ".github/workflows/release.yml", ".github/workflows/supply-chain.yml", ".github/workflows/security-gate.yml", ".github/workflows/runtime-assurance.yml", ".github/workflows/ci.yml", ".github/dependabot.yml", ".github/PULL_REQUEST_TEMPLATE.md", ".github/ISSUE_TEMPLATE/bug_report.yml", ".github/ISSUE_TEMPLATE/feature_request.yml", ".github/ISSUE_TEMPLATE/security_or_infrastructure.yml", ".github/ISSUE_TEMPLATE/config.yml"]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit("Missing required standards: " + ", ".join(missing))
          print(f"Validated {len(required)} required repository standards")
      - name: Validate exact production dependency lock syntax
        shell: python
        run: |
          from pathlib import Path
          import re
          lock = Path("requirements-release.lock")
          pin = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]*==[^\s;]+$")
          entries = []
          for raw in lock.read_text(encoding="utf-8").splitlines():
              line = raw.split("#", 1)[0].strip()
              if line:
                  entries.append(line)
          if not entries or any(not pin.fullmatch(line) for line in entries):
              raise SystemExit("requirements-release.lock must contain only exact package==version pins")
          names = [line.split("==", 1)[0].lower().replace("_", "-") for line in entries]
          if len(names) != len(set(names)):
              raise SystemExit("requirements-release.lock contains duplicate package names")
          print(f"Validated {len(entries)} exact production dependency pins")
      - name: Validate Windows production wheel hash lock syntax
        shell: python
        run: |
          from pathlib import Path
          import re

          plain_entries = {}
          for raw in Path("requirements-release.lock").read_text(encoding="utf-8").splitlines():
              line = raw.split("#", 1)[0].strip()
              if not line:
                  continue
              name, version = line.split("==", 1)
              plain_entries[name.lower().replace("_", "-")] = version

          hashed_entries = {}
          pattern = re.compile(
              r"^([A-Za-z0-9][A-Za-z0-9._-]*)==([^\s;]+) --hash=sha256:([0-9a-f]{64})$"
          )
          for raw in Path("requirements-release-win312.lock").read_text(encoding="utf-8").splitlines():
              line = raw.split("#", 1)[0].strip()
              if not line:
                  continue
              match = pattern.fullmatch(line)
              if not match:
                  raise SystemExit("requirements-release-win312.lock contains an invalid hashed pin: " + line)
              name, version, digest = match.groups()
              canonical = name.lower().replace("_", "-")
              if canonical in hashed_entries:
                  raise SystemExit("requirements-release-win312.lock contains a duplicate package: " + name)
              hashed_entries[canonical] = (version, digest)

          if set(hashed_entries) != set(plain_entries):
              missing = sorted(set(plain_entries) - set(hashed_entries))
              extra = sorted(set(hashed_entries) - set(plain_entries))
              raise SystemExit(f"Windows wheel hash lock package mismatch; missing={missing}; extra={extra}")
          mismatched = [
              name for name, version in plain_entries.items()
              if hashed_entries[name][0] != version
          ]
          if mismatched:
              raise SystemExit("Windows wheel hash lock version mismatch: " + ", ".join(sorted(mismatched)))
          print(f"Validated {len(hashed_entries)} exact Windows wheel hashes")
      - name: Enforce code ownership of security-critical surfaces
        shell: python
        run: |
          from pathlib import Path
          codeowners = Path(".github/CODEOWNERS").read_text(encoding="utf-8")
          required_patterns = (
              "/.github/workflows/",
              "/.github/scripts/",
              "/.github/dependabot.yml",
              "/.github/CODEOWNERS",
              "/SECURITY.md",
              "/SUPPLY_CHAIN.md",
              "/RELEASE_PROCESS.md",
              "/Dockerfile",
              "/requirements*.txt",
              "/requirements*.lock",
              "/packaging/",
              "/desktop/updater.py",
              "/desktop/update_client.py",
              "/app/network_security.py",
              "/app/connectors.py",
              "/app/vault.py",
              "/app/sandbox.py",
              "/app/browser_adapter.py",
              "/app/model_gateway.py",
              "/app/ollama_client.py",
              "/app/tools/",
              "/plugins/",
              "/skills/",
          )
          missing = [pattern for pattern in required_patterns if pattern not in codeowners]
          if missing:
              raise SystemExit("Security-critical CODEOWNERS coverage is incomplete: " + ", ".join(missing))
          for line in codeowners.splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              if "@directordiesel" not in stripped:
                  raise SystemExit("CODEOWNERS entry lacks the repository security owner: " + stripped)
          print(f"Validated CODEOWNERS coverage for {len(required_patterns)} security-critical surfaces")
      - name: Enforce immutable GitHub Action references and checkout credential isolation
        shell: python
        run: |
          from pathlib import Path
          import re
          workflows = sorted(Path(".github/workflows").glob("*.y*ml"))
          uses_re = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)")
          sha_re = re.compile(r"^[0-9a-fA-F]{40}$")
          failures = []
          for workflow in workflows:
              lines = workflow.read_text(encoding="utf-8").splitlines()
              for index, line in enumerate(lines):
                  match = uses_re.match(line)
                  if not match:
                      continue
                  reference = match.group(1)
                  if reference.startswith("./") or reference.startswith("docker://"):
                      continue
                  if "@" not in reference:
                      failures.append(f"{workflow}:{index + 1}: action reference has no immutable ref: {reference}")
                      continue
                  action, ref = reference.rsplit("@", 1)
                  if not sha_re.fullmatch(ref):
                      failures.append(f"{workflow}:{index + 1}: action is not pinned to a 40-character commit SHA: {reference}")
                  if action == "actions/checkout":
                      window = "\n".join(lines[index + 1:index + 8])
                      if not re.search(r"^\s+persist-credentials:\s*false\s*(?:#.*)?$", window, re.MULTILINE):
                          failures.append(f"{workflow}:{index + 1}: actions/checkout must set persist-credentials: false")
          if failures:
              raise SystemExit("GitHub Actions policy violations:\n- " + "\n- ".join(failures))
          print(f"Validated immutable action references across {len(workflows)} workflows")
      - name: Enforce controlled release ref
        shell: python
        run: |
          from pathlib import Path
          release = Path(".github/workflows/release.yml").read_text(encoding="utf-8")
          failures = []
          trigger_block = release.split("permissions:", 1)[0]
          if "\n  push:" in trigger_block:
              failures.append("release workflow must not publish from push-triggered mutable branches")
          if "workflow_dispatch:" not in trigger_block:
              failures.append("release workflow must retain manual workflow_dispatch")
          if "if: github.ref == 'refs/heads/main'" not in release:
              failures.append("release job must be restricted to refs/heads/main")
          if "security-preflight:" not in release or "needs: security-preflight" not in release:
              failures.append("production signing must depend on release security preflight")
          if "python tools/dpn_security_gate.py --github" not in release or "python -m pip_audit -r" not in release:
              failures.append("release security preflight must run source and dependency security audits")
          if "windows-release-assets:" not in release or "needs: windows-release-assets" not in release:
              failures.append("release publication must depend on verified Windows production assets")
          if "packaging\\windows\\build-release-assets.ps1" not in release:
              failures.append("release workflow must use the fail-closed Windows production asset builder")
          if ".github/scripts/verify_windows_release_bundle.py" not in release:
              failures.append("release workflow must independently verify transferred Windows assets")
          if "requirements-release.lock" not in release or ".github/scripts/verify_release_lock.py" not in release:
              failures.append("release workflow must validate and audit the exact production dependency lock")
          production_builder = Path("packaging/windows/build-release-assets.ps1").read_text(encoding="utf-8")
          package_builder = Path("packaging/windows/build.ps1").read_text(encoding="utf-8")
          for required_token in ("-m venv", "--require-hashes", "--no-deps", "--only-binary=:all:", "requirements-release.lock", "requirements-release-win312.lock", "verify_release_lock.py"):
              if required_token not in production_builder:
                  failures.append(f"production release builder is missing reproducibility control: {required_token}")
          if "dependency_lock_sha256" not in package_builder:
              failures.append("package build manifest must record the exact production dependency lock hash")
          if "dependency_wheel_hash_lock_sha256" not in package_builder:
              failures.append("package build manifest must record the exact Windows wheel hash lock hash")
          if "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6" not in release:
              failures.append("release workflow must use the pinned GitHub provenance attestation action")
          windows_job = release.split("  windows-release-assets:", 1)[1].split("  release:", 1)[0] if "  windows-release-assets:" in release else ""
          publication_job = release.split("  release:", 1)[1] if "  release:" in release else ""
          if "id-token: write" not in windows_job or "attestations: write" not in windows_job:
              failures.append("Windows release build must have scoped OIDC and attestation permissions")
          if "id-token: write" not in publication_job or "attestations: write" not in publication_job:
              failures.append("release publication must have scoped OIDC and attestation permissions")
          if "Attest production Windows release bundle" not in windows_job:
              failures.append("Windows production bundle must receive build provenance before upload")
          if "Attest release source archive" not in publication_job:
              failures.append("release source archive must receive build provenance before publication")
          for secret_name in (
              "DPN_WINDOWS_SIGNING_PFX_B64",
              "DPN_WINDOWS_SIGNING_PFX_PASSWORD",
              "DPN_UPDATE_ED25519_PRIVATE_KEY_B64",
              "DPN_UPDATE_ED25519_PUBLIC_KEY_HEX",
          ):
              if f"secrets.{secret_name}" not in release:
                  failures.append(f"release workflow is missing required external signing secret reference: {secret_name}")
          if failures:
              raise SystemExit("Release control policy violations: " + "; ".join(failures))
          print("Validated main-only manual release policy")
      - name: Reject tracked runtime secrets and private state
        shell: python
        run: |
          import re, subprocess
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          pattern = re.compile(r"(^|/)\.env$|(^|/)(vault|master)[^/]*\.key$|(^|/)FIRST_RUN_LOGIN\.txt$|(^|/)data/.*\.(sqlite|sqlite3|db|enc)$|(^|/)workspace/generated/|(^|/)workspace/uploads/|(^|/)runtime_logs/|(^|/)install_logs/", re.I)
          sensitive = [p for p in tracked if pattern.search(p)]
          if sensitive:
              raise SystemExit("Sensitive/runtime files are tracked: " + ", ".join(sensitive))
      - name: Detect unresolved merge conflicts and oversized files
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          conflicts = []
          oversized = []
          for name in tracked:
              path = Path(name)
              if not path.is_file():
                  continue
              if path.stat().st_size > 99614720:
                  oversized.append(f"{name} ({path.stat().st_size} bytes)")
              if path.suffix.lower() != ".md":
                  try:
                      text = path.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  if any(line.startswith("<<<<<<< ") or line.startswith(">>>>>>> ") for line in text.splitlines()):
                      conflicts.append(name)
          if conflicts:
              raise SystemExit("Possible unresolved merge conflicts: " + ", ".join(conflicts))
          if oversized:
              raise SystemExit("Tracked files exceed 95 MB: " + ", ".join(oversized))
