name: DPN AI v8 Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpn-ai-v8-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strict-release-readiness:
    if: github.actor == 'directordiesel'
    name: v8 Strict Release Readiness
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version

      - name: Install validation dependencies
        shell: cmd
        run: python -m pip install -r requirements-dev.txt

      - name: Run repository and version guard
        shell: cmd
        run: python .github\scripts\ci_repository_guard.py

      - name: Run source security gate
        shell: cmd
        run: python tools\dpn_security_gate.py --github

      - name: Run complete automated test suite
        shell: cmd
        run: python -m pytest -q

      - name: Run all v8 desktop tests explicitly
        shell: cmd
        run: python -m pytest -q tests -k "v8"

      - name: Enforce strict v8 release readiness
        shell: cmd
        run: python tools\v8_release_gate.py

      - name: Release gate summary
        if: always()
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## DPN AI v8 Strict Release Gate'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- No release is published by this workflow.'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Stable promotion remains separately authorized.'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Version, documentation, tests, security, packaging isolation, and signing readiness are enforced.'
