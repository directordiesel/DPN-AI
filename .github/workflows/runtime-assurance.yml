name: Runtime & Recovery Assurance

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/runtime-assurance.yml"
      - ".github/scripts/runtime_assurance.py"
      - "app/**"
      - "tests/**"
      - "requirements*.txt"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/runtime-assurance.yml"
      - ".github/scripts/runtime_assurance.py"
      - "app/**"
      - "tests/**"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-assurance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-recovery:
    name: runtime-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install DPN AI development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run focused persistence and recovery regression suite
        run: |
          python -m pytest -q \
            tests/test_secure_database.py \
            tests/test_database_maintenance.py \
            tests/test_persistence_security.py \
            tests/test_v5_chat_recovery.py \
            tests/test_authorization_boundaries.py
      - name: Run live startup, auth, restart, corruption, and recovery assurance
        run: python .github/scripts/runtime_assurance.py
      - name: Reject leaked runtime state after assurance
        shell: python
        run: |
          import re
          import subprocess
          status = subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=all"], text=True, errors="replace").splitlines()
          pattern = re.compile(r"(^| )data/.*\.(sqlite|sqlite3|db|enc)$|(^| )runtime_logs/|(^| )workspace/generated/", re.I)
          leaked = [line for line in status if pattern.search(line)]
          if leaked:
              raise SystemExit("Runtime assurance leaked private state into the checkout:\n" + "\n".join(leaked))
