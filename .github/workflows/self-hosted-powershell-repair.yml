name: DPN Self-Hosted PowerShell Repair

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/self-hosted-powershell-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-powershell:
    name: Repair and verify PowerShell on DIESEL-118
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Identify runner account and current policy
        shell: cmd
        run: |
          whoami
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Get-ExecutionPolicy -List | Format-Table -AutoSize"

      - name: Set CurrentUser policy to RemoteSigned
        shell: cmd
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force; Write-Host 'CurrentUser policy:' (Get-ExecutionPolicy -Scope CurrentUser)"

      - name: Verify standard GitHub PowerShell execution
        shell: powershell
        run: |
          Write-Host "PowerShell is working normally on runner $env:RUNNER_NAME"
          Write-Host "Effective policy: $(Get-ExecutionPolicy)"
          Get-ExecutionPolicy -List | Format-Table -AutoSize
          Write-Host "DPN self-hosted PowerShell repair verified."
