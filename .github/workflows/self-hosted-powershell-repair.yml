name: DPN GitHub-Hosted PowerShell Validation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/self-hosted-powershell-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-powershell:
    name: Validate PowerShell on GitHub-hosted Windows
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Identify hosted runner and execution policy
        shell: cmd
        run: |
          whoami
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Get-ExecutionPolicy -List | Format-Table -AutoSize"
      - name: Verify GitHub PowerShell execution
        shell: powershell
        run: |
          Write-Host "PowerShell is working normally on runner $env:RUNNER_NAME"
          Write-Host "Effective policy: $(Get-ExecutionPolicy)"
          Get-ExecutionPolicy -List | Format-Table -AutoSize
          Write-Host "DPN GitHub-hosted PowerShell validation passed."
