name: DPN Security Gate v2

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-security:
    name: Source Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Run DPN source security scanner
        run: python tools/dpn_security_gate.py --github

      - name: Security gate summary
        if: success()
        run: |
          {
            echo "## DPN Security Gate v2"
            echo ""
            echo "- Tracked secret/runtime state: checked"
            echo "- Private-key and credential patterns: checked"
            echo "- Unsafe symlink escapes: checked"
            echo "- Python unsafe execution/deserialization: checked"
            echo "- Weak MD5/SHA-1 security hashing: checked"
            echo "- JavaScript dynamic execution primitives: checked"
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-audit:
    name: Python Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit declared Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          vulnerability-service: PyPI
          summary: true
