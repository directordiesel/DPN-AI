name: DPN Security Gate v2

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-security-main:
    if: github.event_name != 'pull_request'
    name: Source Security
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve trusted Windows Python
        shell: cmd
        run: .github\scripts\resolve_windows_python.cmd
      - name: Verify configured Python
        shell: cmd
        run: |
          where python
          python --version
      - name: Run DPN source security scanner
        shell: cmd
        run: python tools\dpn_security_gate.py --github

  dependency-audit-main:
    if: github.event_name != 'pull_request'
    name: Python Dependency Vulnerability Audit
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve trusted Windows Python
        shell: cmd
        run: .github\scripts\resolve_windows_python.cmd
      - name: Verify configured Python
        shell: cmd
        run: |
          where python
          python --version
      - name: Install pip-audit
        shell: cmd
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared Python dependencies
        shell: cmd
        run: python -m pip_audit -r requirements.txt

  source-security-pr-trusted:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'directordiesel'
    name: Source Security
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve trusted Windows Python
        shell: cmd
        run: .github\scripts\resolve_windows_python.cmd
      - name: Verify configured Python
        shell: cmd
        run: |
          where python
          python --version
      - name: Run DPN source security scanner
        shell: cmd
        run: python tools\dpn_security_gate.py --github

  dependency-audit-pr-trusted:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'directordiesel'
    name: Python Dependency Vulnerability Audit
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve trusted Windows Python
        shell: cmd
        run: .github\scripts\resolve_windows_python.cmd
      - name: Verify configured Python
        shell: cmd
        run: |
          where python
          python --version
      - name: Install pip-audit
        shell: cmd
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared Python dependencies
        shell: cmd
        run: python -m pip_audit -r requirements.txt

  source-security-pr:
    if: github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'directordiesel')
    name: Source Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Run DPN source security scanner
        run: python tools/dpn_security_gate.py --github

  dependency-audit-pr:
    if: github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'directordiesel')
    name: Python Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Audit declared Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          vulnerability-service: PyPI
          summary: true
