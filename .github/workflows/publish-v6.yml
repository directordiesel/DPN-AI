name: Legacy (Retired) DPN AI v6 Publisher

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retired-publish-dpn-ai-v6.0.0
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy publisher retired
        shell: bash
        run: |
          echo "DPN AI v6.0.0 is a historical immutable release."
          echo "This workflow is intentionally retained only as a visible retirement marker."
          echo "Use .github/workflows/release.yml for current explicitly authorized releases."
          echo "No tag, release, artifact, repository file, permission, or secret is modified by this workflow."
