name: V10 Promotion Once

on:
  push:
    branches:
      - v10/batch-18-production-readiness-stable-release
    paths:
      - .github/workflows/v10-promotion-once.yml

permissions:
  contents: write

concurrency:
  group: v10-promotion-once
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Promote exact governed version surfaces
        shell: python
        run: |
          from pathlib import Path

          def exact_replace(path, old, new, count):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s) of {old!r}, found {actual}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          version = Path("VERSION").read_text(encoding="utf-8")
          if version != "9.0.0\n":
              raise SystemExit(f"VERSION precondition failed: {version!r}")
          Path("VERSION").write_text("10.0.0\n", encoding="utf-8")

          exact_replace("app/main.py", 'APP_VERSION = "9.0.0"', 'APP_VERSION = "10.0.0"', 1)
          exact_replace("app/static/sw.js", "dpn-ai-v9.0.0-ui-shell", "dpn-ai-v10.0.0-ui-shell", 1)
          exact_replace("app/static/sw.js", "/styles.css?v=9.0.0", "/styles.css?v=10.0.0", 1)
          exact_replace("app/static/sw.js", "/app.js?v=9.0.0", "/app.js?v=10.0.0", 1)
          exact_replace("app/static/index.html", "DPN AI v9 — Control Center", "DPN AI v10 — Control Center", 1)
          exact_replace("app/static/index.html", "/styles.css?v=9.0.0", "/styles.css?v=10.0.0", 1)
          exact_replace("app/static/index.html", "/app.js?v=9.0.0", "/app.js?v=10.0.0", 1)
          exact_replace("app/static/app.js", "navigator.serviceWorker.register('/sw.js?v=9.0.0')", "navigator.serviceWorker.register('/sw.js?v=10.0.0')", 1)
          exact_replace("ROADMAP.md", "> Current stable baseline: **v9.0.0**", "> Current stable baseline: **v10.0.0**", 1)
          exact_replace("ROADMAP.md", "> Active engineering direction: **v9.1 hardening, capability expansion, and production refinement**", "> Active engineering direction: **v10.0.0 stable-release validation and production refinement**", 1)

          exact_replace("README.md", "Stable-v9.0.0", "Stable-v10.0.0", 1)
          exact_replace("README.md", "Release-Published", "Release-Publication--Pending", 1)
          exact_replace("README.md", "<strong>Stable release:</strong> v9.0.0", "<strong>Stable release:</strong> v10.0.0", 1)
          exact_replace("README.md", "## Download v9.0.0", "## v10.0.0 Release Candidate", 1)
          exact_replace("README.md", "The current published stable release is **DPN AI v9.0.0**.", "DPN AI **v10.0.0** metadata is promoted and final publication is pending. The v9.0.0 GitHub Release remains the previously published stable artifact until v10 publication succeeds.", 1)

      - name: Install focused validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify promoted repository state
        run: |
          python - <<'PY'
          from app.version_surface_audit_v10 import require_promoted_repository_versions
          values = require_promoted_repository_versions('.')
          assert values['VERSION'] == '10.0.0'
          assert values['app_runtime'] == '10.0.0'
          PY
          python -m pytest -q tests/test_v7_version_consistency.py tests/test_v7_release_candidate.py tests/test_v5_ui_voice_polish.py tests/test_version_promotion_v10.py tests/test_version_surface_audit_v10.py

      - name: Commit promotion and self-remove
        run: |
          git rm .github/workflows/v10-promotion-once.yml
          git config user.name "DPN v10 Release Bot"
          git config user.email "112266230+directordiesel@users.noreply.github.com"
          git add VERSION app/main.py README.md ROADMAP.md app/static/index.html app/static/app.js app/static/sw.js
          git diff --cached --check
          git commit -m "v10 batch18 promote active metadata to 10.0.0"
          git push origin HEAD:v10/batch-18-production-readiness-stable-release
