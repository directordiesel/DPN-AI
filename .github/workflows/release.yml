name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release tag matching VERSION (example: v10.0.1 or v10.1.0-rc.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease (must match VERSION prerelease state)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  security-preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DISPATCH_VERSION: ${{ github.event.inputs.version }}
      DISPATCH_PRERELEASE: ${{ github.event.inputs.prerelease }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up security Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate exact release request
        shell: bash
        run: |
          repository_version="$(tr -d '\r\n ' < VERSION)"
          python .github/scripts/validate_release_request.py --version "$repository_version" --tag "$DISPATCH_VERSION" --prerelease "$DISPATCH_PRERELEASE"
          if git rev-parse "$DISPATCH_VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $DISPATCH_VERSION already exists. Existing releases must not be overwritten."
            exit 1
          fi

      - name: Run repository and source security guards
        run: |
          python .github/scripts/ci_repository_guard.py
          python tools/dpn_security_gate.py --github

      - name: Install locked dependency audit toolchain
        run: python -m pip install --disable-pip-version-check -r .github/requirements-security.txt

      - name: Audit all declared Python dependency surfaces
        shell: bash
        run: |
          for requirements_file in requirements.txt requirements-build.txt requirements-browser.txt requirements-desktop.txt requirements-voice.txt; do
            echo "Auditing $requirements_file"
            python -m pip_audit -r "$requirements_file"
          done

  windows-release-assets:
    needs: security-preflight
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DISPATCH_VERSION: ${{ github.event.inputs.version }}
      DISPATCH_PRERELEASE: ${{ github.event.inputs.prerelease }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate exact release request
        shell: pwsh
        run: |
          $repositoryVersion = (Get-Content VERSION -Raw).Trim()
          python .github/scripts/validate_release_request.py --version "$repositoryVersion" --tag "$env:DISPATCH_VERSION" --prerelease "$env:DISPATCH_PRERELEASE"
          if ($LASTEXITCODE -ne 0) { throw "Release request validation failed." }
          $existingTag = [string](git tag --list "$env:DISPATCH_VERSION")
          if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
            throw "Tag $env:DISPATCH_VERSION already exists. Existing releases must not be overwritten."
          }
          "DPN_RELEASE_VERSION=$repositoryVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $channel = if ($env:DISPATCH_PRERELEASE -eq "true") { "beta" } else { "stable" }
          "DPN_RELEASE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run repository and version guard
        run: python .github/scripts/ci_repository_guard.py

      - name: Build verified signed production Windows assets
        shell: pwsh
        env:
          DPN_WINDOWS_SIGNING_PFX_B64: ${{ secrets.DPN_WINDOWS_SIGNING_PFX_B64 }}
          DPN_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.DPN_WINDOWS_SIGNING_PFX_PASSWORD }}
          DPN_UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.DPN_UPDATE_ED25519_PRIVATE_KEY_B64 }}
          DPN_UPDATE_ED25519_PUBLIC_KEY_HEX: ${{ secrets.DPN_UPDATE_ED25519_PUBLIC_KEY_HEX }}
        run: |
          & .\packaging\windows\build-release-assets.ps1 -Python python -Version "$env:DPN_RELEASE_VERSION" -Channel "$env:DPN_RELEASE_CHANNEL"
          if ($LASTEXITCODE -ne 0) { throw "Production Windows release asset build failed." }

      - name: Upload verified production Windows assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DPN-AI-production-windows-${{ github.sha }}
          path: |
            dist/installer/DPN-AI-Setup-*.exe
            dist/installer/installer-manifest.json
            dist/installer/source-build-manifest.json
            dist/installer/update-manifest.json
            dist/installer/WINDOWS_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  release:
    needs: windows-release-assets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ARTIFACT_BASENAME: DPN-AI
      DISPATCH_VERSION: ${{ github.event.inputs.version }}
      DISPATCH_PRERELEASE: ${{ github.event.inputs.prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified production Windows assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: DPN-AI-production-windows-${{ github.sha }}
          path: windows-release


      - name: Resolve release request
        shell: bash
        run: |
          echo "VERSION=$DISPATCH_VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$DISPATCH_PRERELEASE" >> "$GITHUB_ENV"

      - name: Validate exact release request
        shell: bash
        run: |
          repository_version="$(tr -d '\r\n ' < VERSION)"
          python .github/scripts/validate_release_request.py \
            --version "$repository_version" \
            --tag "$DISPATCH_VERSION" \
            --prerelease "$DISPATCH_PRERELEASE"

      - name: Run repository and version guard
        run: python .github/scripts/ci_repository_guard.py

      - name: Reject tracked runtime secrets and private state
        shell: bash
        run: |
          sensitive="$(git ls-files | grep -Ei '(^|/)\.env$|(^|/)(vault|master)[^/]*\.key$|(^|/)FIRST_RUN_LOGIN\.txt$|(^|/)data/.*\.(sqlite|sqlite3|db|enc)$|(^|/)backups/|(^|/)runtime_logs/|(^|/)install_logs/|(^|/)workspace/generated/|(^|/)workspace/uploads/' || true)"
          test -z "$sensitive" || { echo "::error::Sensitive/runtime files are tracked:"; echo "$sensitive"; exit 1; }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q app tests launch.py manage.py installer_python_probe.py .github/scripts/sign_update_manifest.py .github/scripts/verify_windows_release_bundle.py

      - name: Run release tests
        run: pytest -q

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists. Existing releases must not be overwritten."
            exit 1
          fi

      - name: Verify transferred production Windows bundle
        env:
          DPN_UPDATE_ED25519_PUBLIC_KEY_HEX: ${{ secrets.DPN_UPDATE_ED25519_PUBLIC_KEY_HEX }}
        run: |
          repository_version="$(tr -d '\r\n ' < VERSION)"
          channel="stable"
          if [ "$PRERELEASE" = "true" ]; then channel="beta"; fi
          python .github/scripts/verify_windows_release_bundle.py --root windows-release --version "$repository_version" --channel "$channel"


      - name: Generate release SBOM and source manifest
        env:
          DPN_VERSION: ${{ env.VERSION }}
        run: python .github/scripts/generate_supply_chain.py

      - name: Build source archive and checksums
        shell: bash
        run: |
          archive="${ARTIFACT_BASENAME}-${VERSION}-source.zip"
          git archive --format=zip --output "$archive" HEAD
          sha256sum "$archive" > SHA256SUMS.txt
          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Version: ${VERSION}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > RELEASE_MANIFEST.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="${ARTIFACT_BASENAME}-${VERSION}-source.zip"
          args=(
            "$VERSION"
            --target "$GITHUB_SHA"
            --title "${ARTIFACT_BASENAME} ${VERSION}"
            --generate-notes
            "$archive"
            "SHA256SUMS.txt"
            "RELEASE_MANIFEST.txt"
            "SBOM.spdx.json"
            "SOURCE_SHA256SUMS.txt"
            "DEPENDENCY_INVENTORY.txt"
            "$(find windows-release -maxdepth 1 -type f -name 'DPN-AI-Setup-*.exe' -print -quit)"
            "windows-release/installer-manifest.json"
            "windows-release/source-build-manifest.json"
            "windows-release/update-manifest.json"
            "windows-release/WINDOWS_SHA256SUMS.txt"
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Release published"
            echo ""
            echo "- Version: `$VERSION`"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Authenticode-signed Windows installer attached"
            echo "- Ed25519-signed update manifest attached"
            echo "- Windows release checksums and signer manifests attached"
            echo "- Source archive and release SHA-256 checksum attached"
            echo "- SPDX SBOM attached"
            echo "- Full tracked-source SHA-256 manifest attached"
            echo "- Declared dependency inventory attached"
            echo "- Generated release notes enabled"
          } >> "$GITHUB_STEP_SUMMARY"
