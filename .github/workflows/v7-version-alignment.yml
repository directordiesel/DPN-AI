name: DPN AI v7 Version Alignment

on:
  push:
    branches:
      - feature/dpn-ai-agentic-v7

permissions:
  contents: write

jobs:
  align-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dpn-ai-agentic-v7
          fetch-depth: 0
      - name: Align runtime version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          expected = Path('VERSION').read_text(encoding='utf-8').strip()
          path = Path('app/main.py')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(r'^APP_VERSION\s*=\s*["\'][^"\']+["\']', f'APP_VERSION = "{expected}"', text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('APP_VERSION assignment not found exactly once')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          text = Path('app/main.py').read_text(encoding='utf-8')
          m = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', text, flags=re.MULTILINE)
          if not m or m.group(1) != version:
              raise SystemExit('Runtime version still mismatched')
          PY
          if git diff --quiet -- app/main.py; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py
          git commit -m "fix(v7): align runtime version with VERSION"
          git push origin HEAD:feature/dpn-ai-agentic-v7
