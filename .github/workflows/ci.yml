name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trusted-internal-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'directordiesel'
    name: Self-hosted Windows / Local Python
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version
          python -m pip --version

      - name: Install development dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run portable repository and version guard
        shell: cmd
        run: python .github\scripts\ci_repository_guard.py

      - name: Compile Python sources
        shell: cmd
        run: python -m compileall -q app tests launch.py manage.py installer_python_probe.py .github\scripts\ci_repository_guard.py

      - name: Run test suite
        shell: cmd
        run: python -m pytest -q

      - name: Trusted PR summary
        if: always()
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## DPN trusted internal PR CI"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Runner: $env:RUNNER_NAME"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- OS: $env:RUNNER_OS"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Python: local runner installation"

  external-pr-hosted:
    if: github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'directordiesel')
    name: ${{ matrix.os_name }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Ubuntu
            os: ubuntu-latest
            python: "3.11"
          - os_name: Ubuntu
            os: ubuntu-latest
            python: "3.12"
          - os_name: Windows
            os: windows-latest
            python: "3.11"
          - os_name: Windows
            os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run portable repository and version guard
        run: python .github/scripts/ci_repository_guard.py

      - name: Compile Python sources
        run: python -m compileall -q app tests launch.py manage.py installer_python_probe.py .github/scripts/ci_repository_guard.py

      - name: Run test suite
        run: python -m pytest -q
