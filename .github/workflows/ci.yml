name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os_name }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Ubuntu
            os: ubuntu-latest
            python: "3.11"
          - os_name: Ubuntu
            os: ubuntu-latest
            python: "3.12"
          - os_name: Windows
            os: windows-latest
            python: "3.11"
          - os_name: Windows
            os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run portable repository and version guard
        run: python .github/scripts/ci_repository_guard.py

      - name: Compile Python sources
        run: python -m compileall -q app tests launch.py manage.py installer_python_probe.py .github/scripts/ci_repository_guard.py .github/scripts/memory_release_readiness_v10.py

      - name: Run test suite
        run: python -m pytest -q

      - name: Run Batch 8 memory release readiness gate
        if: matrix.os_name == 'Ubuntu' && matrix.python == '3.11'
        run: python .github/scripts/memory_release_readiness_v10.py

      - name: Hosted runner summary
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## DPN AI GitHub-hosted CI lane\n\n")
              handle.write(f"- operating system: {os.environ.get('RUNNER_OS', 'unknown')}\n")
              handle.write(f"- Python: {os.environ.get('MATRIX_PYTHON', 'unknown')}\n")
              handle.write("- repository guard: executed\n")
              handle.write("- compile validation: executed\n")
              handle.write("- automated tests: executed\n")
              if os.environ.get("RUNNER_OS") == "Linux" and os.environ.get("MATRIX_PYTHON") == "3.11":
                  handle.write("- Batch 8 memory release readiness: executed\n")
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
