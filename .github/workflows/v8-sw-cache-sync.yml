name: DPN AI v8 Service Worker Cache Sync

on:
  push:
    branches:
      - feature/dpn-ai-desktop-v8
    paths:
      - ".github/workflows/v8-sw-cache-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/dpn-ai-desktop-v8
          fetch-depth: 0

      - name: Normalize service worker registration version
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          $path = ".\app\static\app.js"
          $text = Get-Content $path -Raw
          $old = "navigator.serviceWorker.register('/sw.js?v=6.0.0')"
          $new = "navigator.serviceWorker.register('/sw.js?v=8.0.0')"
          if ($text.Contains($old)) { $text = $text.Replace($old, $new) }
          $matches = [regex]::Matches($text, [regex]::Escape($new)).Count
          if ($matches -ne 1) { throw "Expected exactly one v8.0.0 service worker registration; found $matches" }
          Set-Content -Path $path -Value $text -Encoding utf8 -NoNewline

      - name: Verify targeted regression
        shell: powershell
        run: python -m pytest -q tests\test_v5_ui_voice_polish.py

      - name: Commit verified fix
        shell: powershell
        run: |
          git config user.name "DPN GitHub Operations"
          git config user.email "112266230+directordiesel@users.noreply.github.com"
          git add app/static/app.js
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix(v8): sync service worker registration to 8.0.0"
            git push origin HEAD:feature/dpn-ai-desktop-v8
          }
